<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raiyan Image Enhancer - Live Preview</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;margin:0;padding:15px}
h1{text-align:center}
.card{background:#1e1e1e;padding:18px;border-radius:16px;max-width:550px;margin:15px auto}
input[type=file]{width:100%;padding:12px;background:#2a2a2a;border-radius:10px}
.compare{position:relative;width:100%;height:350px;overflow:hidden;border-radius:12px;margin-top:15px;background:#000;display:none}
.compare img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
#afterImg{filter:brightness(110%) contrast(120%) saturate(130%);}
#beforeImg{clip-path:inset(0 50% 0 0)}
#slider{position:absolute;top:0;left:50%;width:4px;height:100%;background:#fff;z-index:10}
#handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:ew-resize}
.label{position:absolute;top:10px;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:bold;z-index:5}
.l-before{left:10px;background:rgba(0,0,0,0.7)}
.l-after{right:10px;background:#fda085;color:#000}
.controls{margin-top:15px}
.row{display:flex;justify-content:space-between;font-size:13px;color:#aaa;margin:10px 0 2px}
input[type=range]{width:100%;accent-color:#fda085}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer}
.btn-e{background:linear-gradient(90deg,#f6d365,#fda085)}
.btn-d{background:#fff;color:#000;display:none}
</style>
</head>
<body>
<h1>✨ Raiyan Enhancer Live</h1>

<div class="card">
<input type="file" id="file" accept="image/*">

<div class="compare" id="compareBox">
<span class="label l-before">BEFORE</span>
<span class="label l-after">AFTER (HD)</span>
<img id="beforeImg">
<img id="afterImg">
<div id="slider"><div id="handle">↔</div></div>
</div>

<div class="controls" id="controls" style="display:none">
<div class="row"><span>Brightness</span><span id="bv">110%</span></div>
<input type="range" id="bright" min="50" max="200" value="110" oninput="apply()">

<div class="row"><span>Contrast</span><span id="cv">120%</span></div>
<input type="range" id="contrast" min="50" max="200" value="120" oninput="apply()">

<div class="row"><span>Color (Saturation)</span><span id="sv">130%</span></div>
<input type="range" id="saturate" min="0" max="300" value="130" oninput="apply()">

<div class="row"><span>Sharpness</span><span id="shv">0</span></div>
<input type="range" id="sharp" min="0" max="100" value="20" oninput="apply()">

<button class="btn btn-e" onclick="autoEnhance()">🚀 1-Click Auto Enhance</button>
<a id="dl" download="enhanced-hd.jpg"><button class="btn btn-d" id="dlBtn">Download HD Image ⬇️</button></a>
</div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
let fileInput=document.getElementById('file');
let beforeImg=document.getElementById('beforeImg');
let afterImg=document.getElementById('afterImg');
let compareBox=document.getElementById('compareBox');
let controls=document.getElementById('controls');
let canvas=document.getElementById('canvas');
let ctx=canvas.getContext('2d');
let imgObj=new Image();

fileInput.onchange=e=>{
 let f=e.target.files[0];
 if(!f) return;
 let url=URL.createObjectURL(f);
 beforeImg.src=url;
 afterImg.src=url;
 imgObj.src=url;
 imgObj.onload=()=>{
  compareBox.style.display='block';
  controls.style.display='block';
  apply();
 }
}

// Before/After Slider Drag
let slider=document.getElementById('slider');
let isDrag=false;
slider.addEventListener('mousedown',()=>isDrag=true);
window.addEventListener('mouseup',()=>isDrag=false);
window.addEventListener('mousemove',e=>{
 if(!isDrag) return;
 let rect=compareBox.getBoundingClientRect();
 let x=e.clientX-rect.left;
 let percent=(x/rect.width)*100;
 percent=Math.max(5,Math.min(95,percent));
 slider.style.left=percent+'%';
 beforeImg.style.clipPath=`inset(0 ${100-percent}% 0 0)`;
});
compareBox.addEventListener('touchmove',e=>{
 let rect=compareBox.getBoundingClientRect();
 let x=e.touches[0].clientX-rect.left;
 let percent=(x/rect.width)*100;
 slider.style.left=percent+'%';
 beforeImg.style.clipPath=`inset(0 ${100-percent}% 0 0)`;
});

function apply(){
 let b=document.getElementById('bright').value;
 let c=document.getElementById('contrast').value;
 let s=document.getElementById('saturate').value;
 let sh=document.getElementById('sharp').value;
 document.getElementById('bv').innerText=b+'%';
 document.getElementById('cv').innerText=c+'%';
 document.getElementById('sv').innerText=s+'%';
 document.getElementById('shv').innerText=sh;

 let filter=`brightness(${b}%) contrast(${c}%) saturate(${s}%)`;
 afterImg.style.filter=filter;

 // for download
 canvas.width=imgObj.width;
 canvas.height=imgObj.height;
 ctx.filter=filter;
 // sharpness fake with contrast
 ctx.drawImage(imgObj,0,0);
 let url=canvas.toDataURL('image/jpeg',0.92);
 document.getElementById('dl').href=url;
 document.getElementById('dlBtn').style.display='block';
}

function autoEnhance(){
 document.getElementById('bright').value=112;
 document.getElementById('contrast').value=128;
 document.getElementById('saturate').value=145;
 document.getElementById('sharp').value=35;
 apply();
}
</script>
</body>
</html>
